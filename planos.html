<style>
/* ── Planos ── */
.plans-section{padding:96px 0 64px;background:var(--bg)}
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
@media(max-width:900px){.plans-grid{grid-template-columns:1fr;max-width:420px;margin-left:auto;margin-right:auto}}

.plan-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;position:relative;transition:all .35s;display:flex;flex-direction:column}
.plan-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(0,51,160,0.1)}
.plan-card.featured{border:2px solid var(--cobalt);box-shadow:0 8px 40px rgba(0,51,160,0.15)}
.plan-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--cobalt);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:5px 16px;border-radius:999px;white-space:nowrap;text-transform:uppercase}

.plan-name{font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--cobalt);margin-bottom:8px}
.plan-price{font-size:42px;font-weight:800;letter-spacing:-0.03em;line-height:1}
.plan-price span{font-size:16px;font-weight:500;color:var(--muted-fg)}
.plan-desc{margin-top:12px;font-size:14px;color:var(--muted-fg);line-height:1.6}
.plan-divider{height:1px;background:var(--border);margin:24px 0}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:12px;flex:1}
.plan-features li{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.plan-features li::before{content:"✓";width:20px;height:20px;border-radius:50%;background:rgba(0,51,160,0.08);color:var(--cobalt);font-size:11px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.plan-features li.off{opacity:.4}
.plan-features li.off::before{content:"×";background:rgba(0,0,0,0.05);color:var(--muted-fg)}
.plan-cta{margin-top:28px;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .25s;font-family:'Montserrat',sans-serif}
.plan-cta.primary{background:var(--cobalt);color:#fff}
.plan-cta.primary:hover{background:var(--cobalt-light);box-shadow:0 6px 20px rgba(0,51,160,0.35)}
.plan-cta.outline{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt)}
.plan-cta.outline:hover{background:rgba(0,51,160,0.06)}

/* ── Chat Section ── */
.chat-section{padding:64px 0 96px;background:var(--muted)}
.chat-wrapper{max-width:780px;margin:0 auto}
.chat-intro{text-align:center;margin-bottom:40px}
.chat-intro p{margin-top:12px;color:var(--muted-fg)}

.chat-box{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.06)}
.chat-header{background:var(--cobalt);padding:18px 24px;display:flex;align-items:center;gap:12px}
.chat-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.chat-header-info h4{color:#fff;font-size:15px;font-weight:700;margin:0}
.chat-header-info p{color:rgba(255,255,255,0.65);font-size:12px;margin:0}
.chat-status{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,0.3);margin-left:auto;flex-shrink:0}

.chat-messages{height:380px;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{display:flex;gap:10px;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.msg.bot .msg-avatar{background:var(--cobalt);color:#fff}
.msg.user .msg-avatar{background:var(--muted);color:var(--muted-fg)}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6}
.msg.bot .msg-bubble{background:var(--muted);border-bottom-left-radius:4px}
.msg.user .msg-bubble{background:var(--cobalt);color:#fff;border-bottom-right-radius:4px}

.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted-fg);opacity:0.5;animation:typingBounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px);opacity:1}}

.chat-suggestions{padding:0 24px 16px;display:flex;flex-wrap:wrap;gap:8px}
.suggestion-btn{background:transparent;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif;color:var(--foreground)}
.suggestion-btn:hover{border-color:var(--cobalt);color:var(--cobalt);background:rgba(0,51,160,0.04)}

.chat-input-row{display:flex;gap:0;border-top:1px solid var(--border);padding:16px}
.chat-input{flex:1;border:1px solid var(--border);border-radius:10px 0 0 10px;padding:12px 16px;font-size:14px;font-family:'Montserrat',sans-serif;outline:none;transition:border-color .2s;resize:none;background:var(--bg)}
.chat-input:focus{border-color:var(--cobalt)}
.chat-send{background:var(--cobalt);color:#fff;border:none;border-radius:0 10px 10px 0;padding:12px 20px;cursor:pointer;font-size:18px;transition:background .2s;flex-shrink:0}
.chat-send:hover{background:var(--cobalt-light)}
.chat-send:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>

<div class="page-hero" style="position:relative;overflow:hidden">
  <canvas id="particleCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas>
  <div class="page-hero-content container" style="position:relative;z-index:1">
    <span class="eyebrow">Assinatura</span>

<script>
(function(){
  const canvas = document.getElementById("particleCanvas");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let W, H;
  function resize(){ W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
  resize();
  window.addEventListener("resize", resize);
  function rp(){ return { x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+1, dx: (Math.random()-.5)*.5, dy: (Math.random()-.5)*.5, alpha: Math.random()*.5+.1 }; }
  for(let i=0;i<80;i++) particles.push(rp());
  function drawLines(){
    for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){ ctx.beginPath(); ctx.strokeStyle="rgba(0,51,160,"+(0.15*(1-d/120))+")"; ctx.lineWidth=.8; ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.stroke(); }
    }
  }
  function animate(){
    ctx.clearRect(0,0,W,H); drawLines();
    particles.forEach(p=>{ p.x+=p.dx; p.y+=p.dy; if(p.x<0||p.x>W) p.dx*=-1; if(p.y<0||p.y>H) p.dy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle="rgba(0,51,160,"+p.alpha+")"; ctx.fill(); });
    requestAnimationFrame(animate);
  }
  animate();
})();
<\/script>

<script src="script.js"></script>
<script>
// ── Chat Bot ──
// Após fazer o deploy no Vercel, substitua pela sua URL real:
// ex: 'https://educia-api.vercel.app/api/chat'
const API_URL = 'https://educia-api-9iq5.vercel.app/api/chat';

const SYSTEM_PROMPT = `Você é o assistente virtual do EducIA, um site de conteúdo sobre como usar Inteligência Artificial de forma correta, consciente e produtiva na educação e no trabalho.

Seu papel é ajudar os visitantes a entenderem os planos de assinatura e escolherem o ideal para eles. Seja simpático, direto e use linguagem informal mas profissional (use "você", não "tu").

PLANOS DISPONÍVEIS:
- Gratuito (R$0/mês): 2 vídeos por mês, artigos introdutórios, newsletter mensal.
- Pro (R$29/mês): vídeos ilimitados, exercícios práticos com IA, artigos exclusivos, newsletter semanal, certificado de conclusão.
- Premium (R$69/mês): tudo do Pro + mentorias ao vivo mensais, comunidade exclusiva, trilhas personalizadas, suporte prioritário, early access a novos conteúdos.

Quando o usuário demonstrar interesse em assinar, incentive-o a clicar no botão do plano escolhido na página. Responda sempre em português brasileiro. Seja conciso — respostas de até 3-4 parágrafos curtos.

RECLAMAÇÕES E SUPORTE:
Se o usuário fizer uma reclamação, expressar insatisfação ou precisar de suporte, responda com empatia, peça desculpas pelo inconveniente e oriente-o a entrar em contato com a equipe pelo e-mail equipe.educia@gmail.com, dizendo que eles vão resolver o problema o mais rápido possível.`;

let history = [];

function addMessage(role, text) {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'bot' ? '🤖' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = text.replace(/\n/g, '<br>');
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('chatSuggestions').style.display = 'none';

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  addTyping();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM_PROMPT, messages: history })
    });
    const data = await res.json();
    const reply = data.content.map(b => b.text || '').join('');
    removeTyping();
    addMessage('bot', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    removeTyping();
    addMessage('bot', 'Ops, tive um problema de conexão. Tente novamente em instantes!');
  }

  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

function sendSuggestion(btn) {
  document.getElementById('chatInput').value = btn.textContent;
  sendMessage();
}

function selectPlan(plan) {
  document.getElementById('chatInput').value = `Quero assinar o plano ${plan}. O que preciso fazer?`;
  document.querySelector('.chat-section').scrollIntoView({ behavior: 'smooth' });
  setTimeout(sendMessage, 600);
}

// Mensagem inicial do bot
window.addEventListener('load', () => {
  setTimeout(() => {
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMessage('bot', 'Olá! 👋 Sou o assistente do EducIA. Posso te ajudar a entender nossos planos e encontrar o ideal para você.\n\nTemos opções desde o gratuito até o Premium com mentorias ao vivo. Pode me perguntar qualquer coisa!');
    }, 900);
  }, 500);
});

// Auto-resize textarea
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
</script>
